name: 'Bulki Image Optimizer'
description: 'Compress, resize, and convert images (JPEG, PNG, WebP, AVIF) in CI/CD. Fast, free, no API keys.'
author: 'PuntoyComaTech'

branding:
  icon: 'image'
  color: 'orange'

inputs:
  path:
    description: 'File or directory to optimize'
    required: true
  format:
    description: 'Output format: jpeg, png, webp, gif, avif'
    required: false
  quality:
    description: 'Output quality (1-100)'
    required: false
    default: '70'
  resize:
    description: 'Max width in pixels'
    required: false
  max-size:
    description: 'Fail if any output exceeds this size (e.g., 200kb, 1mb)'
    required: false
  output:
    description: 'Folder where optimized images are written (default: ./bulki-output). Originals are never modified.'
    required: false
  bulki-version:
    description: 'bulki version to run (npm version or range)'
    required: false
    default: '3'
  destination:
    description: 'Deprecated: use `output`. Base directory; output goes to <destination>/<output-folder>'
    required: false
    default: '.'
  output-folder:
    description: 'Deprecated: use `output`. Output folder name inside `destination`'
    required: false
    default: 'bulki-output'

outputs:
  json:
    description: 'JSON results of the optimization'
    value: ${{ steps.bulki.outputs.json }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Run bulki
      id: bulki
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_QUALITY: ${{ inputs.quality }}
        INPUT_RESIZE: ${{ inputs.resize }}
        INPUT_MAX_SIZE: ${{ inputs.max-size }}
        INPUT_DESTINATION: ${{ inputs.destination }}
        INPUT_OUTPUT_FOLDER: ${{ inputs.output-folder }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_BULKI_VERSION: ${{ inputs.bulki-version }}
      run: |
        # Build argv as an array: each input stays exactly one argument
        # (no literal quotes, spaces in paths are safe, nothing is re-parsed by the shell)
        ARGS=(compress "$INPUT_PATH" -q "$INPUT_QUALITY" --json)
        [ -n "$INPUT_FORMAT" ] && ARGS+=(-f "$INPUT_FORMAT")
        [ -n "$INPUT_RESIZE" ] && ARGS+=(-r "$INPUT_RESIZE")
        [ -n "$INPUT_MAX_SIZE" ] && ARGS+=(--max-size "$INPUT_MAX_SIZE")
        if [ -n "$INPUT_OUTPUT" ]; then
          ARGS+=(-o "$INPUT_OUTPUT")
        else
          # legacy inputs: -d <base> -o <name>  →  <base>/<name>
          ARGS+=(-d "$INPUT_DESTINATION" -o "$INPUT_OUTPUT_FOLDER")
        fi

        STATUS=0
        RESULT=$(npx --yes "@puntoycoma/bulki@$INPUT_BULKI_VERSION" "${ARGS[@]}") || STATUS=$?

        EOF="BULKI_$(node -e "process.stdout.write(require('crypto').randomBytes(16).toString('hex'))")"
        {
          echo "json<<$EOF"
          echo "$RESULT"
          echo "$EOF"
        } >> "$GITHUB_OUTPUT"

        if [ -n "$RESULT" ]; then
          node -e "
            const d = JSON.parse(process.argv[1]);
            const s = d.summary;
            console.log('Optimized ' + s.totalFiles + ' files | ' + Math.round(s.totalOriginalSize/1024) + ' KB -> ' + Math.round(s.totalNewSize/1024) + ' KB (' + s.totalReduction + '% reduction)');
            for (const e of d.errors) console.log('::error file=' + e.file + '::' + e.message);
            for (const f of d.files) if (f.exceeded) console.log('::error file=' + f.output + '::exceeds max-size');
          " "$RESULT"
        fi
        exit $STATUS
